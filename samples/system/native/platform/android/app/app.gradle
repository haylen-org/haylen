// Haylen Native answers the platform handlers test with Kotlin and Java handlers that its own `Application` class registers before the first activity starts. The Kotlin handlers are suspending functions, which the `haylen-coroutines` library registers.
android {
    defaultConfig {
        manifestPlaceholders.haylenApplication = "dev.haylen.samples.nativesample.NativeSampleApplication"
    }
}

dependencies {
    implementation "dev.haylen:haylen-coroutines:${providers.gradleProperty("haylen.engineVersion").get()}"
}
