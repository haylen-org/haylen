# XcodeGen spec of App.xcodeproj, which is committed next to it. After changing it, run "python3 make.py xcodegen <app>", which runs the XcodeGen that make.py pins.
# The script make.py writes the gitignored folder haylen/ and nothing else: haylen/project.yml defines the target templates HaylenIOS, HaylenTVOS and HaylenMacOS with the engine, its system frameworks, the package, the splash assets, the merged Info.plist, entitlements and privacy manifest, the native libraries and the native parts of the plugins of the app.
# Each target takes its template in "templates", and a setting or a list of the target itself adds to the template or wins over it. Deleting "templates" leaves the target without the engine, which the target then links itself.
# Every file in source/ builds into every target, so apps add Objective-C, C++ and Swift files there, and Swift reaches the engine through HaylenBridging.h.
# The Info.plist of each platform stays out of the resources, since the template completes it into haylen/ and the target builds the completed one.
name: App
include:
  - haylen/project.yml
options:
  deploymentTarget:
    iOS: "16.3"
    tvOS: "16.3"
    macOS: "13.3"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    PRODUCT_MODULE_NAME: HaylenApp
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: source/HaylenBridging.h
fileGroups:
  - project.yml
targets:
  iOS:
    type: application
    platform: iOS
    templates: [HaylenIOS]
    configFiles:
      Debug: App.xcconfig
      Release: App.xcconfig
    sources:
      - path: source
        type: syncedFolder
      - path: ios
        excludes: [Info.plist]
      - path: ios/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: $(HAYLEN_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(HAYLEN_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Mac Catalyst runs on this Mac without a development team, while devices sign with the team make.py passes.
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        # Mac Catalyst 16.3 would run on macOS 13.2, while the C++ library of the engine needs macOS 13.3, which is Mac Catalyst 16.4.
        IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]: "16.4"
        ASSETCATALOG_COMPILER_APPICON_NAME: app_icon
    scheme: {}
  tvOS:
    type: application
    platform: tvOS
    templates: [HaylenTVOS]
    configFiles:
      Debug: App.xcconfig
      Release: App.xcconfig
    sources:
      - path: source
        type: syncedFolder
      - path: tvos
        excludes: [Info.plist]
      - path: tvos/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: $(HAYLEN_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(HAYLEN_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: app_icon
    scheme: {}
  macOS:
    type: application
    platform: macOS
    templates: [HaylenMacOS]
    configFiles:
      Debug: App.xcconfig
      Release: App.xcconfig
    sources:
      - path: source
        type: syncedFolder
      - path: macos
        excludes: [Info.plist]
      - path: macos/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: $(HAYLEN_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(HAYLEN_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: app_icon
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
