org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
# The script `make.py` rewrites the `haylen.*` keys from `app.json` and points `haylen.repository` at the engine artifacts every time it builds the app. The key `haylen.library` names the native library the activity loads, the Lua player of the `haylen` library or the library of a C++ app.
# The key `haylen.plugins` lists the plugin modules as `id=folder` entries and `haylen.gradlePlugins` their Gradle plugins as `id=version` entries, and every `haylen.placeholder.<name>` key is a manifest placeholder of a plugin.
haylen.repository=../../artifacts/android/maven
haylen.engineVersion=0.0.1
haylen.name=Haylen App
haylen.identifier=dev.haylen.app
haylen.versionName=1.0.0
haylen.versionCode=1000000
haylen.orientation=sensorLandscape
haylen.library=haylen
haylen.plugins=
haylen.gradlePlugins=
