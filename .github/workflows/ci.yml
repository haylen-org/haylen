name: CI

# The workflow only tests: it publishes nothing, and tags and releases start no run. A change that touches only Markdown, the docs or the brand images starts no run either, since the tools tests check the docs on every machine before a commit.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "extras/**"]

# A newer push to the same branch or pull request supersedes the run in progress, so only the run of the newest commit goes on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs read the repository, and a run deletes the compiler caches that the runs before it saved.
permissions:
  contents: read
  actions: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # The development packages that the engine builds against on Linux: Ninja, the X11, Wayland and input libraries that SDL compiles against and loads when the app starts, and the headers of EGL and OpenGL.
  LINUX_PACKAGES: ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libgl1-mesa-dev libegl-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev
  # Mesa lavapipe for Vulkan with its validation layers, and Mesa llvmpipe for OpenGL through EGL, which draw the GPU tests of Linux without a GPU.
  MESA_PACKAGES: mesa-vulkan-drivers libvulkan1 vulkan-validationlayers libegl-mesa0 libgl1-mesa-dri

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: web
          cache-size: 1G
          emscripten: "true"
      - name: Build the prebuilt player for WebGPU and WebGL2
        run: python haylen.py --verbose engine --platform web --jobs ${{ env.JOBS }}
      - name: Check the error screen, the wake lock and the memory of pages in the headless Chrome of the runner
        run: python haylen.py --verbose test --platform web --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()

