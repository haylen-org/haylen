name: CI

# The workflow only tests: it publishes nothing, and tags and releases start no run. Its jobs hand built engine SDKs to each other only within a run. A change that touches only Markdown, the docs or the brand images starts no run either, since the tests of the tooling check the docs on every machine before a commit. A run started by hand tests the whole branch at once.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress, so only the run of the newest commit goes on. A run started by hand has a group of its own, so no push cancels it and it cancels nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'changes' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# The jobs read the repository, and a run deletes the compiler caches that the runs before it saved.
permissions:
  contents: read
  actions: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # The Debug trees keep only the file and line of each instruction, which stack traces and sanitizer reports read, so one build of every job fits in the caches of the repository.
  HAYLEN_DEBUG_INFO: LINES
  # The development packages that the engine builds against on Linux: Ninja, the X11, Wayland and input libraries that SDL compiles against and loads when the app starts, and the headers of EGL and OpenGL.
  LINUX_PACKAGES: ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libgl1-mesa-dev libegl-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev
  # Mesa lavapipe for Vulkan with its validation layers, and Mesa llvmpipe for OpenGL through EGL, which draw the GPU tests of Linux without a GPU.
  MESA_PACKAGES: mesa-vulkan-drivers libvulkan1 vulkan-validationlayers libegl-mesa0 libgl1-mesa-dri

jobs:
  # The command line runs from the lock of the repository with "uv run --locked", the same on every system, and "--verbose" streams the output of every tool into the log of the job.
  format:
    name: Format and tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check the format of the C, C++ and Objective-C sources and of the Python of the tooling with Ruff
        run: uv run --locked haylen --verbose engine format --check
      - name: Test the tooling and the rules of the repository
        run: uv run --locked pytest

  # The GPU tests run the conformance suite and the reference scenes of the 2D renderer on every device that a hosted runner can start, with the validation of each API on: Mesa lavapipe and llvmpipe on Linux, WARP on Windows and the paravirtual GPU of macOS. Windows runners have no Vulkan driver and only the OpenGL 1.1 of the system, so their Vulkan and OpenGL devices do not run here.
  desktop:
    name: Engine tests on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            cache-size: 1G
          - runner: windows-latest
            system: Windows
            cache-size: 1200M
          - runner: macos-latest
            system: macOS
            cache-size: 900M
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} ${{ env.MESA_PACKAGES }}
          save-sources: "true"
          save-tools: shader-compiler ccache
          cache: desktop
          cache-size: ${{ matrix.cache-size }}
      - name: Install the Graphics Tools of Windows, whose debug layer validates Direct3D
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { Add-WindowsCapability -Online -Name Tools.Graphics.DirectX~~~~0.0.1.0 }
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { throw "The Graphics Tools of Windows did not install the debug layer of Direct3D." }
      - name: Run the engine tests
        run: uv run --locked haylen --verbose test --config Debug --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Vulkan through Mesa lavapipe
        if: runner.os == 'Linux'
        run: uv run --locked haylen --verbose test --gpu --config Debug --graphics-api vulkan --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on OpenGL through Mesa llvmpipe and EGL without a display
        if: runner.os == 'Linux'
        run: uv run --locked haylen --verbose test --gpu --config Debug --graphics-api openGl --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Direct3D 12 through WARP
        if: runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: uv run --locked haylen --verbose test --gpu --config Debug --graphics-api direct3D12 --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Direct3D 11 through WARP
        if: runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: uv run --locked haylen --verbose test --gpu --config Debug --graphics-api direct3D11 --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Metal
        if: runner.os == 'macOS'
        run: uv run --locked haylen --verbose test --gpu --config Debug --graphics-api metal --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The proof of an external port, whose engine port and backend install from outside the tooling, and a project that finds the desktop SDK with "find_package", in one job of each system with one compiler cache. Headless Chrome on Linux draws WebGPU through SwiftShader, which cannot share the swapchain of a WebGPU canvas with the compositor, so the macOS job also checks the pages of the web and the start of the protected web release of the test project on WebGPU, which Chrome draws there through Metal, and the web needs no macOS runner of its own.
  port:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: Port and SDK on Linux
            cache-size: 800M
            sdk-target: linux
          - runner: windows-latest
            name: Port and SDK on Windows
            cache-size: 800M
            sdk-target: windows
          - runner: macos-latest
            name: Port, SDK and WebGPU pages on macOS
            cache-size: 1500M
            sdk-target: player
            web: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: port-sdk
          cache-size: ${{ matrix.cache-size }}
          emscripten: ${{ matrix.web == true }}
          save-tools: ${{ matrix.web && 'emscripten' || '' }}
      - name: Prove that an engine port and a backend installed from outside the tooling build, verify and run an app with a plugin
        run: uv run --locked pytest -m port tools/tests/extensions --verbose
        env:
          HAYLEN_JOBS: ${{ env.JOBS }}
      - name: Build the desktop SDK of the system
        run: uv run --locked haylen --verbose sdk build --target ${{ matrix.sdk-target }} --jobs ${{ env.JOBS }}
      - name: Build a project that finds the SDK with "find_package"
        run: uv run --locked haylen --verbose engine consumers --mode package --jobs ${{ env.JOBS }}
      - name: Build the web SDK with the player for WebGPU and WebGL2
        if: matrix.web
        run: uv run --locked haylen --verbose sdk build --target web --jobs ${{ env.JOBS }}
      - name: Check the error screen, the wake lock, the plugins, the editor and the memory of pages on WebGPU in the headless Chrome of the runner
        if: matrix.web
        run: uv run --locked haylen --verbose test --platform web --graphics-api webGpu --jobs ${{ env.JOBS }}
      - name: Check that the protected web release of the test project starts on WebGPU
        if: matrix.web
        run: uv run --locked haylen --verbose test --platform web --app samples/tests --config Release --graphics-api webGpu --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The Intel runners of macOS are virtual machines without a Metal device, so they build the engine for x86-64 and run the engine tests on the null device alone, and the Metal paths of Intel Macs stay untested in CI. The report of the displays shows whether a runner gained a Metal device.
  macos-intel:
    name: macOS on Intel
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          cache: macos-intel
          cache-size: 900M
          save-tools: shader-compiler
      - name: Show the displays of the runner and whether they support Metal
        run: system_profiler SPDisplaysDataType
      - name: Run the engine tests
        run: uv run --locked haylen --verbose test --config Debug --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The test project builds the headless player in the Linux tree of the desktop job, so it reads the compiler cache of that job.
  tests-project:
    name: Test project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: desktop
          cache-size: 1G
      - name: Build the headless player and the test library that the native tests load next to it
        run: uv run --locked haylen --verbose engine build --config Debug --target haylen-headless --target haylen-native-test --jobs ${{ env.JOBS }}
      - name: Run every test of the test project
        run: build/engine/linux-debug/bin/haylen-headless samples/tests --frames 60000

  coverage:
    name: Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
      - name: Measure the coverage of the engine tests
        run: uv run --locked haylen --verbose engine coverage --jobs ${{ env.JOBS }}

  sanitizers:
    name: Sanitizer ${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Run the engine tests under the sanitizer
        run: uv run --locked haylen --verbose test --sanitizers ${{ matrix.sanitizer }} --jobs ${{ env.JOBS }}

  fuzz:
    name: Fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} clang libclang-rt-dev
          cache: fuzz
          cache-size: 600M
      - name: Fuzz the parsers that read hostile bytes for a minute each
        run: uv run --locked haylen --verbose engine fuzz --seconds 60 --llvm /usr/bin --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # WebGPU draws through SwiftShader and WebGL2 through ANGLE on SwiftShader in the headless Chrome of the runner.
  web-gpu:
    name: Web GPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ninja-build
          emscripten: "true"
      - name: Run the GPU tests on WebGPU in the headless Chrome of the runner
        run: uv run --locked haylen --verbose test --gpu --platform web --graphics-api webGpu --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on WebGL2 in the headless Chrome of the runner
        run: uv run --locked haylen --verbose test --gpu --platform web --graphics-api webGl2 --jobs ${{ env.JOBS }}

  # The desktop SDK of Linux and of Windows, with the player and the content tool, builds once per run, and the jobs that build apps take it from these jobs instead of building it again. The SDK of Linux links the libraries of Linux windows. The macOS SDK builds in the macOS jobs that need it, since a job of its own would hold up the slices of the Apple jobs.
  desktop-sdk:
    name: Desktop SDK on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            target: linux
          - runner: windows-latest
            system: Windows
            target: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: desktop-sdk
          cache-size: 600M
      - name: Build the desktop SDK with the player and the content tool
        run: uv run --locked haylen --verbose sdk build --target ${{ matrix.target }} --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/desktop-sdk
        with:
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The protected release takes the content tool of the desktop SDK, and its keys are made for the job and thrown away with the runner, so no secret is involved. The pages draw through WebGL2, since headless Chrome on Linux cannot present a WebGPU canvas, and the macOS job of the port checks them on WebGPU.
  web:
    name: Web
    needs: desktop-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: web
          cache-size: 800M
          emscripten: "true"
          save-tools: emscripten
      - uses: ./.github/actions/desktop-sdk
      - name: Build the web SDK with the player for WebGPU and WebGL2
        run: uv run --locked haylen --verbose sdk build --target web --jobs ${{ env.JOBS }}
      - name: Check the error screen, the wake lock, the plugins, the editor and the memory of pages on WebGL2 in the headless Chrome of the runner
        run: uv run --locked haylen --verbose test --platform web --graphics-api webGl2 --jobs ${{ env.JOBS }}
      - name: Build the protected web release of the test project, inspect it for anything a release never holds and check that it starts
        run: uv run --locked haylen --verbose test --platform web --app samples/tests --config Release --graphics-api webGl2 --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The emulator of an x86-64 image runs on the KVM of the Linux runner and draws through SwiftShader, and the tests run on every device of the Android build that starts there.
  android-gpu:
    name: Android GPU tests
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
      HAYLEN_TEST_GPU_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake, the emulator and its system image
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platform-tools" "emulator" "system-images;android-37.0;default;x86_64"
      - uses: ./.github/actions/build-environment
        with:
          packages: ninja-build
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the virtual device that the tests start
        run: mkdir -p "$ANDROID_AVD_HOME" && echo no | avdmanager create avd --name haylen-gpu-tests --package "system-images;android-37.0;default;x86_64"
      - name: Run the GPU tests on the emulator
        run: uv run --locked haylen --verbose test --gpu --platform android --jobs ${{ env.JOBS }}

  # The protected release of an Android app takes the content tool of the desktop SDK.
  android:
    name: Android
    needs: desktop-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake and the platform
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2"
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: android
          cache-size: 2200M
      - uses: ./.github/actions/desktop-sdk
      - name: Build the Android SDK with the Android libraries in its local Maven repository
        run: uv run --locked haylen --verbose sdk build --target android --jobs ${{ env.JOBS }}
      - name: Create the starter app and the starter C++ app
        run: uv run --locked haylen --verbose new build/starter && uv run --locked haylen --verbose new build/starter-cpp --kind cpp
      - name: Give the starter app an upload key
        run: uv run --locked haylen --verbose app sign build/starter --target android
      - name: Build and verify its protected release APK
        run: uv run --locked haylen --verbose app build build/starter --target android --config Release --jobs ${{ env.JOBS }}
      - name: Build and verify the APK of the starter C++ app, whose C++ code Gradle compiles for every ABI against the SDK
        run: uv run --locked haylen --verbose app build build/starter-cpp --target android --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # Every family of slices of "Haylen.xcframework" builds in a job of its own. The iOS job also builds the desktop SDK of macOS for its content tool and the starter apps for the simulator from the slices it built.
  apple:
    name: Apple ${{ matrix.family }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iOS
            cache: ios
            targets: --target ios --target ios-simulator
          - family: tvOS
            cache: tvos
            targets: --target tvos --target tvos-simulator
          - family: visionOS
            cache: visionos
            targets: --target visionos --target visionos-simulator
          - family: macOS and Mac Catalyst
            cache: mac
            targets: --target macos --target catalyst
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          cache: apple-${{ matrix.cache }}
          cache-size: 600M
          xcodegen: ${{ matrix.family == 'iOS' }}
          save-tools: ${{ matrix.family == 'iOS' && 'xcodegen' || '' }}
      - name: Build the slices of "Haylen.xcframework"
        run: uv run --locked haylen --verbose sdk build ${{ matrix.targets }} --jobs ${{ env.JOBS }}
      - name: Build the desktop SDK of macOS for its content tool
        if: matrix.family == 'iOS'
        run: uv run --locked haylen --verbose sdk build --target player --jobs ${{ env.JOBS }}
      - name: Create the starter app and the starter C++ app
        if: matrix.family == 'iOS'
        run: uv run --locked haylen --verbose new build/starter && uv run --locked haylen --verbose new build/starter-cpp --kind cpp
      - name: Build and verify the protected release of the starter app for the iOS simulator
        if: matrix.family == 'iOS'
        run: uv run --locked haylen --verbose app build build/starter --target ios-simulator --config Release --jobs ${{ env.JOBS }}
      - name: Build and verify the starter C++ app for the iOS simulator, whose C++ code the Xcode project compiles against the SDK
        if: matrix.family == 'iOS'
        run: uv run --locked haylen --verbose app build build/starter-cpp --target ios-simulator --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  desktop-apps:
    name: Desktop apps on ${{ matrix.system }}
    needs: desktop-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            platform: linux
          - runner: windows-latest
            system: Windows
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} dpkg-dev desktop-file-utils
      - uses: ./.github/actions/desktop-sdk
      - name: Install CMake with the AppImage generator of CPack
        if: runner.os == 'Linux'
        run: pip install cmake
      - name: Create the starter app
        run: uv run --locked haylen --verbose new build/starter
      - name: Create a plugin from the plugin template, whose desktop library the app then builds
        run: uv run --locked haylen --verbose plugin new build/echo-check
      - name: Add the plugin to the starter app
        run: uv run --locked haylen --verbose plugin add build/echo-check --app build/starter
      - name: Build, verify and package the protected release of the starter app as the installers of the platform
        run: uv run --locked haylen --verbose app package build/starter --target ${{ matrix.platform }} --format installer --output build/dist --jobs ${{ env.JOBS }}
      - name: Validate the desktop entry
        if: runner.os == 'Linux'
        run: |
          entries=$(find build/apps -path "*linux-release*" -name "*.desktop")
          test -n "$entries" || { echo "The Linux release of the starter app holds no desktop entry."; exit 1; }
          desktop-file-validate $entries

  # A C++ app compiles only its own code against the desktop SDK of the run, in Debug and in its protected Release, whose bootstrap holds the keys that each run makes, so the job keeps no compiler cache.
  cpp-apps:
    name: C++ apps on ${{ matrix.system }}
    needs: desktop-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
          - runner: windows-latest
            system: Windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - uses: ./.github/actions/desktop-sdk
      - name: Create the starter C++ app
        run: uv run --locked haylen --verbose new build/starter-cpp --kind cpp
      - name: Build and verify the starter C++ app
        run: uv run --locked haylen --verbose app build build/starter-cpp --jobs ${{ env.JOBS }}
      - name: Build and verify its protected release
        run: uv run --locked haylen --verbose app build build/starter-cpp --config Release --jobs ${{ env.JOBS }}
