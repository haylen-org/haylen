name: CI

# The workflow only tests: it publishes nothing, and tags and releases start no run.
on:
  push:
    branches: ["**"]
  pull_request:

# Every commit of `main` gets a complete run of its own, while a newer push to another branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install clang-format==23.1.3
      - run: python haylen.py --verbose format --check
      - name: Test the rules of haylen.py
        run: python -m unittest discover -s tools -p "test_*.py"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: pip install ninja
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Test
        run: python haylen.py --verbose test --config Debug
      - name: Build the SDK and a project that finds it with "find_package"
        run: python haylen.py --verbose sdk --config Release --check-consumers package

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - run: python haylen.py --verbose coverage

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # The release that the memory check builds needs the content tool of the desktop artifacts, which links the libraries of Linux windows.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-web-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - uses: actions/cache@v6
        with:
          path: .tools/emsdk
          key: emsdk-${{ hashFiles('haylen.py') }}
      - name: Build the prebuilt player for WebGPU and WebGL2
        run: python haylen.py --verbose engine --platform web
      - name: Check the memory of a page that downloads a large release
        run: python haylen.py --verbose test --platform web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Build the Android library and publish it to the local Maven repository
        run: python haylen.py --verbose engine --platform android
      - name: Build and check the protected release APK of the starter app, with the content tool of the desktop artifacts
        run: |
          python haylen.py --verbose new build/starter
          python haylen.py --verbose android-key build/starter
          python haylen.py --verbose run build/starter --platform android --config Release --build-only

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: brew install ninja
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-apple-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Build "Haylen.xcframework"
        run: python haylen.py --verbose engine --platform apple
      - name: Build and check the protected release of the starter app for the iOS simulator
        run: |
          python haylen.py --verbose new build/starter
          python haylen.py --verbose run build/starter --platform ios-simulator --config Release --build-only

  desktop-apps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev dpkg-dev desktop-file-utils
      - name: Install CMake with the AppImage generator of CPack
        if: runner.os == 'Linux'
        run: pip install cmake
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: pip install ninja
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Create the starter app
        run: python haylen.py --verbose new build/starter
      - name: Add a plugin from the plugin template, whose desktop library the app then builds
        run: |
          python haylen.py --verbose plugin new build/echo-check
          python haylen.py --verbose plugin add build/echo-check --app build/starter
      - name: Build the packages of the starter app from the template of the platform
        run: python haylen.py --verbose dist build/starter --platform ${{ matrix.platform }} --output build/dist
      - name: Check the installed app
        run: python haylen.py --verbose check build/starter --platform ${{ matrix.platform }} --config Release
      - name: Validate the desktop entry
        if: runner.os == 'Linux'
        run: desktop-file-validate build/apps/starter-*/installed/linux/share/applications/*.desktop
      - name: Create the starter C++ app
        run: python haylen.py --verbose new build/starter-cpp --kind cpp
      - name: Build the starter C++ app from the C++ template
        run: python haylen.py --verbose run-cpp build/starter-cpp --build-only
      - name: Build and check the protected release of the starter C++ app
        run: python haylen.py --verbose run-cpp build/starter-cpp --config Release --build-only

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-sanitizers-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Run the engine tests under the sanitizer
        run: python haylen.py --verbose test --sanitizers ${{ matrix.sanitizer }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-fuzz-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Fuzz the parsers that read hostile bytes for a minute each
        run: python haylen.py --verbose fuzz --seconds 60 --llvm /usr/bin

  tests-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Build the headless player and the test library that the native tests load next to it
        run: |
          python haylen.py --verbose build --config Debug --target haylen-headless
          python haylen.py --verbose build --config Debug --target haylen-native-test
      - name: Run every test of the test project
        run: build/linux-debug/bin/haylen-headless samples/tests --frames 60000

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # The release takes the content tool of the desktop artifacts, which build with the player of this system.
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-release-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - uses: actions/cache@v6
        with:
          path: .tools/emsdk
          key: emsdk-${{ hashFiles('haylen.py') }}
      # The keys of this job are made for it and thrown away with the runner, so no secret is involved.
      - name: Build the protected release of the test project for the web
        run: python haylen.py --verbose prepare samples/tests --platform web --config Release
      - name: Inspect it for anything a release never holds
        run: python haylen.py --verbose check samples/tests --platform web --config Release
