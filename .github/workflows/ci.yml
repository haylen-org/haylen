name: CI

# The workflow only tests: it publishes nothing, and tags and releases start no run. A push or a pull request runs the small set: the format and the tests of the tooling, and the engine tests on Linux and macOS. A run started by hand runs the full matrix, every SDK and slice, every platform, the GPU tests, the sanitizers, the test project, the fuzzers and the checks of releases, at the end of each block of work. A change that touches only Markdown, the docs or the brand images starts no run, since the tests of the tooling check the docs on every machine before a commit.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress. A run started by hand has a group of its own, so no push cancels it and it cancels nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'changes' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # The Debug trees keep only the file and line of each instruction, which stack traces and sanitizer reports read, so the objects that the compiler cache moves stay small.
  HAYLEN_DEBUG_INFO: LINES
  # The compiler cache is the prefix "sccache/" of the Cloudflare R2 bucket "haylen-ci", which sccache reaches through its S3 API with the token of the secrets. A pull request from a fork gets no secrets and compiles without it. The server of sccache lives for the whole job.
  SCCACHE_BUCKET: haylen-ci
  SCCACHE_S3_KEY_PREFIX: sccache/
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_IDLE_TIMEOUT: "0"
  SCCACHE_ENDPOINT: ${{ secrets.HAYLEN_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.HAYLEN_R2_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.HAYLEN_R2_SECRET }}
  # Varn builds OpenSSL with its own build system, and it keeps every build as a prebuilt package in this folder, named after everything the build depends on, so a tree takes the package that matches it instead of building OpenSSL. The jobs that build the engine keep the folder in the bucket under "dependencies/".
  VARN_PACKAGE_CACHE: ${{ github.workspace }}/.cache/packages
  # The development packages that the engine builds against on Linux: Ninja, the X11, Wayland and input libraries that SDL compiles against and loads when the app starts, and the headers of EGL and OpenGL.
  LINUX_PACKAGES: ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libgl1-mesa-dev libegl-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev
  # Mesa lavapipe for Vulkan with its validation layers, and Mesa llvmpipe for OpenGL through EGL, which draw the GPU tests of Linux without a GPU.
  MESA_PACKAGES: mesa-vulkan-drivers libvulkan1 vulkan-validationlayers libegl-mesa0 libgl1-mesa-dri

# The jobs that others wait for come first, so they take the runners first when a run has more jobs than runners.
jobs:
  format:
    name: Format and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check the format
        run: uv run --locked haylen --verbose engine format --check
      - name: Test the tooling
        run: uv run --locked pytest

  # The desktop SDK of each system, with the player and the content tool, builds once per run, and the jobs that build apps take it from here, so no job waits for the SDK of another system.
  linux-sdk:
    if: github.event_name == 'workflow_dispatch'
    name: Linux SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: linux-sdk
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Build the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} sdk build --target linux
      - uses: ./.github/actions/sdk
        with:
          name: linux-sdk
          folder: build/sdk/desktop-release
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  windows-sdk:
    if: github.event_name == 'workflow_dispatch'
    name: Windows SDK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: windows-sdk
      - name: Build the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} sdk build --target windows
      - uses: ./.github/actions/sdk
        with:
          name: windows-sdk
          folder: build/sdk/desktop-release
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The web SDK, which the page checks and the Apple job take, and the GPU tests in the headless Chrome of the runner, where WebGPU draws through SwiftShader and WebGL2 through ANGLE on SwiftShader.
  web-sdk:
    if: github.event_name == 'workflow_dispatch'
    name: Web SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ninja-build
          emscripten: "true"
          save-tools: emscripten
      - name: Build the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} sdk build --target web
      - uses: ./.github/actions/sdk
        with:
          name: web-sdk
          folder: build/sdk/web-release
          upload: "true"
      - uses: ./.github/actions/browser
      - name: GPU tests on WebGPU
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --target web --graphics-api webGpu
      - name: GPU tests on WebGL2
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --target web --graphics-api webGl2
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The Android SDK of every ABI, with the Android libraries in its local Maven repository.
  android-sdk:
    if: github.event_name == 'workflow_dispatch'
    name: Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake and the platform
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2"
      - uses: ./.github/actions/build-environment
        with:
          dependencies: android-sdk
          packages: ninja-build
          gradle: android-sdk
          save-tools: gradle
      - name: Build the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} sdk build --target android
      - uses: ./.github/actions/sdk
        with:
          name: android-sdk
          folder: build/sdk/android-release
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The slices of "Haylen.xcframework" compile with the architectures that the SDK ships in parallel jobs, one slice each, and the Apple job joins them. The slices of the iOS and tvOS simulators, which the UI tests take, build in a job of their own that comes first, so the UI tests start once those two slices are built.
  apple-simulator-slices:
    if: github.event_name == 'workflow_dispatch'
    name: Apple slice
    strategy:
      fail-fast: false
      matrix:
        slice: [ios-simulator, tvos-simulator]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-slice
        with:
          slice: ${{ matrix.slice }}

  apple-slices:
    if: github.event_name == 'workflow_dispatch'
    name: Apple slice
    strategy:
      fail-fast: false
      matrix:
        slice: [macos, catalyst, ios, tvos, visionos, visionos-simulator]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-slice
        with:
          slice: ${{ matrix.slice }}

  # The desktop SDK of macOS, whose content tool builds the protected releases of the Apple job.
  macos-sdk:
    if: github.event_name == 'workflow_dispatch'
    name: macOS SDK
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: macos-sdk
      - name: Build the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} sdk build --target player
      - uses: ./.github/actions/sdk
        with:
          name: macos-sdk
          folder: build/sdk/desktop-release
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The engine tests and the GPU tests on every device that a hosted runner starts, with the validation of each API on: Mesa lavapipe and llvmpipe on Linux, WARP on Windows and the paravirtual GPU of macOS. Windows runners have no Vulkan driver and only the OpenGL 1.1 of the system.
  tests:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["Linux", "macOS", "Windows"]' || '["Linux", "macOS"]') }}
    runs-on: ${{ fromJSON('{"Linux":"ubuntu-latest","macOS":"xcode-27","Windows":"windows-latest"}')[matrix.system] }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: tests-${{ matrix.system }}
          packages: ${{ env.LINUX_PACKAGES }} ${{ env.MESA_PACKAGES }}
          save-sources: "true"
          save-tools: shader-compiler
      - name: Install the Direct3D debug layer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { Add-WindowsCapability -Online -Name Tools.Graphics.DirectX~~~~0.0.1.0 }
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { throw "The Graphics Tools of Windows did not install the debug layer of Direct3D." }
      - name: Engine tests
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test
      - name: GPU tests on Vulkan
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --graphics-api vulkan
      - name: GPU tests on OpenGL
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --graphics-api openGl
      - name: GPU tests on Direct3D 12
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --graphics-api direct3D12
      - name: GPU tests on Direct3D 11
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --graphics-api direct3D11
      - name: GPU tests on Metal
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --graphics-api metal
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # AddressSanitizer with UndefinedBehaviorSanitizer and ThreadSanitizer run the engine tests in shards, which together run every test once.
  sanitizers:
    if: github.event_name == 'workflow_dispatch'
    name: Sanitizers
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            shard: 1/3
          - sanitizer: address
            shard: 2/3
          - sanitizer: address
            shard: 3/3
          - sanitizer: thread
            shard: 1/2
          - sanitizer: thread
            shard: 2/2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: sanitizers-${{ matrix.sanitizer }}
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Engine tests
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --sanitizers ${{ matrix.sanitizer }} --shard ${{ matrix.shard }}
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The headless player runs the categories of the test project in two shards, which together run every test once.
  test-project:
    if: github.event_name == 'workflow_dispatch'
    name: Test project
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: test-project
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Build the headless player
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} engine build --config Debug --cmake-target haylen-headless --cmake-target haylen-native-test
      - name: Run the test project
        env:
          HAYLEN_TESTS_SHARD: ${{ matrix.shard }}
        run: build/engine/linux-debug/bin/haylen-headless samples/tests --frames 60000
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  fuzz:
    if: github.event_name == 'workflow_dispatch'
    name: Fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: fuzz
          packages: ${{ env.LINUX_PACKAGES }} clang libclang-rt-dev
      - name: Fuzz each parser for a minute
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} engine fuzz --seconds 60 --llvm /usr/bin
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # An engine port and a backend installed from outside the tooling build, verify and run an app with a plugin, and the test port plays its app under ThreadSanitizer, which checks the worker threads of the loop that the port pumps.
  port:
    if: github.event_name == 'workflow_dispatch'
    name: Port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          dependencies: port
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Prove an external port
        env:
          HAYLEN_JOBS: ${{ env.JOBS }}
        run: uv run --locked pytest -m port tools/tests/extensions --verbose
      - name: Port under ThreadSanitizer
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --port --sanitizers thread
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The emulator of an x86-64 image runs on the KVM of the runner and draws through SwiftShader.
  android-gpu:
    if: github.event_name == 'workflow_dispatch'
    name: Android GPU tests
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
      HAYLEN_TEST_GPU_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake, the emulator and its image
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platform-tools" "emulator" "system-images;android-37.0;default;x86_64"
      - uses: ./.github/actions/build-environment
        with:
          dependencies: android-gpu
          packages: ninja-build
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the virtual device
        run: mkdir -p "$ANDROID_AVD_HOME" && echo no | avdmanager create avd --name haylen-gpu-tests --package "system-images;android-37.0;default;x86_64"
      - name: GPU tests on the emulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --gpu --target android
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The start of the protected release of the test project and its UI tests on the Android emulator, which answer the permission dialogs, tap the notifications from the app, the home screen and the recent apps, and press the back button.
  android-ui:
    if: github.event_name == 'workflow_dispatch'
    name: Android UI tests
    needs: [linux-sdk, android-sdk]
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake, the platform, the emulator and its image
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2" "platform-tools" "emulator" "system-images;android-37.0;default;x86_64"
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          gradle: android-ui
      - uses: ./.github/actions/sdk
        with:
          name: linux-sdk
      - uses: ./.github/actions/sdk
        with:
          name: android-sdk
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the virtual device
        run: mkdir -p "$ANDROID_AVD_HOME" && echo no | avdmanager create avd --name haylen-ui-tests --device medium_phone --package "system-images;android-37.0;default;x86_64"
      - name: Create an upload key
        run: uv run --locked haylen --verbose app sign samples/tests --target android
      - name: Start the protected release
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --target android --app samples/tests --config Release
      - name: UI tests on the emulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --ui samples/tests --target android
      - name: Keep the results of the UI tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-results
          path: build/apps/*/ui-tests/android
          retention-days: 3
          if-no-files-found: ignore
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # A project that finds the desktop SDK of the run with "find_package", the starter app with a plugin from the plugin template, packaged as the installers of the system, and the starter C++ app in Debug and in its protected Release.
  linux-apps:
    if: github.event_name == 'workflow_dispatch'
    name: Linux apps
    needs: linux-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} dpkg-dev desktop-file-utils
      - uses: ./.github/actions/sdk
        with:
          name: linux-sdk
      - name: Build a project that finds the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} engine consumers --mode package
      - name: Install CMake with the AppImage generator
        run: pip install cmake
      - name: Create the starter apps and a plugin
        run: |
          uv run --locked haylen --verbose new build/starter
          uv run --locked haylen --verbose new build/starter-cpp --kind cpp
          uv run --locked haylen --verbose plugin new build/echo-check
          uv run --locked haylen --verbose plugin add build/echo-check --app build/starter
      - name: Package the protected release as installers
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app package build/starter --target linux --format installer --output build/dist
      - name: Validate the desktop entry
        run: |
          entries=$(find build/apps -path "*linux-release*" -name "*.desktop")
          test -n "$entries" || { echo "The Linux release of the starter app holds no desktop entry."; exit 1; }
          desktop-file-validate $entries
      - name: Build the C++ app
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp
      - name: Build the protected release of the C++ app
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp --config Release
      - uses: ./.github/actions/compiler-cache
        if: always()

  windows-apps:
    if: github.event_name == 'workflow_dispatch'
    name: Windows apps
    needs: windows-sdk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
      - uses: ./.github/actions/sdk
        with:
          name: windows-sdk
      - name: Build a project that finds the SDK
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} engine consumers --mode package
      # Bash stops the step at the first command that fails, which PowerShell would not.
      - name: Create the starter apps and a plugin
        shell: bash
        run: |
          uv run --locked haylen --verbose new build/starter
          uv run --locked haylen --verbose new build/starter-cpp --kind cpp
          uv run --locked haylen --verbose plugin new build/echo-check
          uv run --locked haylen --verbose plugin add build/echo-check --app build/starter
      - name: Package the protected release as an installer
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app package build/starter --target windows --format installer --output build/dist
      - name: Build the C++ app
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp
      - name: Build the protected release of the C++ app
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp --config Release
      - uses: ./.github/actions/compiler-cache
        if: always()

  # The checks of the pages in two shards, and the start of the protected web release of the test project in the first, in the headless Chrome of the runner, on WebGL2, since headless Chrome on Linux cannot present a WebGPU canvas. The Apple job checks the start on WebGPU.
  web:
    if: github.event_name == 'workflow_dispatch'
    name: Web
    needs: [linux-sdk, web-sdk]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          emscripten: "true"
      - uses: ./.github/actions/sdk
        with:
          name: linux-sdk
      - uses: ./.github/actions/sdk
        with:
          name: web-sdk
      - uses: ./.github/actions/browser
      - name: Check the pages
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --target web --graphics-api webGl2 --shard ${{ matrix.shard }}
      - name: Start the protected release of the test project
        if: matrix.shard == '1/2'
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --target web --app samples/tests --config Release --graphics-api webGl2
      - name: Keep the logs of the failed pages
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-page-logs-${{ strategy.job-index }}
          path: build/logs/web-checks
          retention-days: 3
          if-no-files-found: ignore
      - uses: ./.github/actions/compiler-cache
        if: always()

  # The signed protected release of the starter app and the starter C++ app, whose C++ code Gradle compiles for every ABI against the Android SDK of the run.
  android:
    if: github.event_name == 'workflow_dispatch'
    name: Android
    needs: [linux-sdk, android-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake and the platform
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2"
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          gradle: android
      - uses: ./.github/actions/sdk
        with:
          name: linux-sdk
      - uses: ./.github/actions/sdk
        with:
          name: android-sdk
      - name: Create the starter apps and an upload key
        run: |
          uv run --locked haylen --verbose new build/starter
          uv run --locked haylen --verbose new build/starter-cpp --kind cpp
          uv run --locked haylen --verbose app sign build/starter --target android
      - name: Build the protected release
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter --target android --config Release
      - name: Build the C++ app
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp --target android
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches

  # The UI tests of the test project on the iOS and tvOS simulators, which answer the prompts of the system, tap the notifications from the app, the Home Screen and a closed app, and press the remote of the TV.
  apple-ui:
    if: github.event_name == 'workflow_dispatch'
    name: Apple UI tests
    needs: apple-simulator-slices
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          xcodegen: "true"
      - uses: ./.github/actions/sdk
        with:
          name: apple-slice-ios-simulator
      - uses: ./.github/actions/sdk
        with:
          name: apple-slice-tvos-simulator
      - name: Join the slices of the simulators
        run: uv run --locked haylen --verbose sdk join build/slices/ios-simulator build/slices/tvos-simulator
      - name: UI tests on the iOS simulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --ui samples/tests --target ios-simulator
      - name: UI tests on the tvOS simulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --ui samples/tests --target tvos-simulator
      - name: Keep the results of the UI tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-ui-results
          path: build/engine/*-simulator-ui-tests/derived/Logs/Test
          retention-days: 3
          if-no-files-found: ignore
      - uses: ./.github/actions/compiler-cache
        if: always()

  # The joined Apple SDK, the starter apps for the iOS simulator against it, and the start of the protected web release of the test project on WebGPU, which Chrome draws through Metal.
  apple:
    if: github.event_name == 'workflow_dispatch'
    name: Apple
    needs: [apple-simulator-slices, apple-slices, macos-sdk, web-sdk]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          xcodegen: "true"
          emscripten: "true"
          save-tools: xcodegen emscripten
      - uses: ./.github/actions/sdk
        with:
          name: apple-slice-*
      - uses: ./.github/actions/sdk
        with:
          name: macos-sdk
      - uses: ./.github/actions/sdk
        with:
          name: web-sdk
      - name: Join the slices
        run: uv run --locked haylen --verbose sdk join build/slices/*
      - name: Create the starter apps
        run: |
          uv run --locked haylen --verbose new build/starter
          uv run --locked haylen --verbose new build/starter-cpp --kind cpp
      - name: Build the protected release for the iOS simulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter --target ios-simulator --config Release
      - name: Build the C++ app for the iOS simulator
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} app build build/starter-cpp --target ios-simulator
      - uses: ./.github/actions/browser
      - name: Start the protected web release on WebGPU
        run: uv run --locked haylen --verbose --jobs ${{ env.JOBS }} test --target web --app samples/tests --config Release --graphics-api webGpu
      - uses: ./.github/actions/compiler-cache
        if: always()
      - uses: ./.github/actions/caches
