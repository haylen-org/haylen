name: CI

on:
  push:
  pull_request:

# Every commit of `main` gets a complete run of its own, while a newer push to another branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install clang-format==23.1.1
      - run: python make.py format --check

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libxext-dev libxrandr-dev libgl1-mesa-dev
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: pip install ninja
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Test
        run: python make.py test --config Debug
      - name: Build the SDK and an app that finds it with "find_package"
        run: python make.py embedding --mode package --config Release

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - run: python make.py coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/coverage/html

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-web-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - uses: actions/cache@v6
        with:
          path: .tools/emsdk
          key: emsdk-${{ hashFiles('make.py') }}
      - name: Build the prebuilt player for WebGPU and WebGL2
        run: python make.py engine --platform web
      - uses: actions/upload-artifact@v7
        with:
          name: haylen-web
          path: build/artifacts/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.0"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Build the Android library and publish it to the local Maven repository
        run: python make.py engine --platform android
      - uses: actions/upload-artifact@v7
        with:
          name: haylen-android
          path: build/artifacts/android/maven

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: brew install ninja
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-apple-${{ hashFiles('engine/cmake/haylen-dependencies.cmake') }}
      - name: Build "Haylen.xcframework"
        run: python make.py engine --platform apple
      - uses: actions/upload-artifact@v7
        with:
          name: haylen-apple
          path: build/artifacts/apple
