name: CI

# The workflow only tests: it publishes nothing, and tags and releases start no run. Its jobs hand built engine artifacts to each other only within a run. A change that touches only Markdown, the docs or the brand images starts no run either, since the tools tests check the docs on every machine before a commit. A run started by hand tests the whole branch at once.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "extras/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress, so only the run of the newest commit goes on. A run started by hand has a group of its own, so no push cancels it and it cancels nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'changes' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# The jobs read the repository, and a run deletes the compiler caches that the runs before it saved.
permissions:
  contents: read
  actions: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # The development packages that the engine builds against on Linux: Ninja, the X11, Wayland and input libraries that SDL compiles against and loads when the app starts, and the headers of EGL and OpenGL.
  LINUX_PACKAGES: ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libgl1-mesa-dev libegl-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev
  # Mesa lavapipe for Vulkan with its validation layers, and Mesa llvmpipe for OpenGL through EGL, which draw the GPU tests of Linux without a GPU.
  MESA_PACKAGES: mesa-vulkan-drivers libvulkan1 vulkan-validationlayers libegl-mesa0 libgl1-mesa-dri

jobs:
  format:
    name: Format and tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check the format
        run: python haylen.py --verbose format --check
      - name: Test the rules of haylen.py
        run: python -m unittest discover -s tools -p "test_*.py"

  # The GPU tests run the conformance suite and the reference scenes of the 2D renderer on every device that a hosted runner can start, with the validation of each API on: Mesa lavapipe and llvmpipe on Linux, WARP on Windows and the paravirtual GPU of macOS. Windows runners have no Vulkan driver and only the OpenGL 1.1 of the system, so their Vulkan and OpenGL devices do not run here.
  desktop:
    name: Engine tests on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            cache-size: 1G
          - runner: windows-latest
            system: Windows
            cache-size: 1200M
          - runner: macos-latest
            system: macOS
            cache-size: 900M
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} ${{ env.MESA_PACKAGES }}
          save-sources: "true"
          save-tools: shader-compiler ccache
          cache: desktop
          cache-size: ${{ matrix.cache-size }}
      - name: Install the Graphics Tools of Windows, whose debug layer validates Direct3D
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { Add-WindowsCapability -Online -Name Tools.Graphics.DirectX~~~~0.0.1.0 }
          if (-not (Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll")) { throw "The Graphics Tools of Windows did not install the debug layer of Direct3D." }
      - name: Run the engine tests
        run: python haylen.py --verbose test --config Debug --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Vulkan through Mesa lavapipe
        if: runner.os == 'Linux'
        run: python haylen.py --verbose test --gpu --config Debug --graphics-api vulkan --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on OpenGL through Mesa llvmpipe and EGL without a display
        if: runner.os == 'Linux'
        run: python haylen.py --verbose test --gpu --config Debug --graphics-api openGl --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Direct3D 12 through WARP
        if: runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: python haylen.py --verbose test --gpu --config Debug --graphics-api direct3D12 --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Direct3D 11 through WARP
        if: runner.os == 'Windows'
        env:
          HAYLEN_TEST_GPU_SOFTWARE: "1"
        run: python haylen.py --verbose test --gpu --config Debug --graphics-api direct3D11 --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on Metal
        if: runner.os == 'macOS'
        run: python haylen.py --verbose test --gpu --config Debug --graphics-api metal --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The test port and the SDK build trees of their own, next to the engine tests instead of after them, in one job of each system with one compiler cache. Headless Chrome on Linux draws WebGPU through SwiftShader, which cannot share the swapchain of a WebGPU canvas with the compositor, so the macOS job also checks the pages of the web on WebGPU, which Chrome draws there through Metal, and the web needs no macOS runner of its own.
  desktop-port:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: Test port and SDK on Linux
            cache-size: 800M
          - runner: windows-latest
            name: Test port and SDK on Windows
            cache-size: 800M
          - runner: macos-latest
            name: Test port, SDK and WebGPU pages on macOS
            cache-size: 1500M
            web: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: port-sdk
          cache-size: ${{ matrix.cache-size }}
          emscripten: ${{ matrix.web == true }}
          save-tools: ${{ matrix.web && 'emscripten' || '' }}
      - name: Build the engine with the test port and play its app on it
        run: python haylen.py --verbose test --port --config Debug --jobs ${{ env.JOBS }}
      - name: Build the SDK and a project that finds it with "find_package"
        run: python haylen.py --verbose sdk --config Release --check-consumers package --jobs ${{ env.JOBS }}
      - name: Build the prebuilt player for WebGPU and WebGL2
        if: matrix.web
        run: python haylen.py --verbose engine --platform web --jobs ${{ env.JOBS }}
      - name: Check the error screen, the wake lock and the memory of pages on WebGPU in the headless Chrome of the runner
        if: matrix.web
        run: python haylen.py --verbose test --platform web --graphics-api webGpu --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The Intel runners of macOS are virtual machines without a Metal device, so they build the engine for x86-64 and run the engine tests on the null device alone, and the Metal paths of Intel Macs stay untested in CI. The report of the displays shows whether a runner gained a Metal device.
  macos-intel:
    name: macOS on Intel
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          cache: macos-intel
          cache-size: 900M
          save-tools: shader-compiler
      - name: Show the displays of the runner and whether they support Metal
        run: system_profiler SPDisplaysDataType
      - name: Run the engine tests
        run: python haylen.py --verbose test --config Debug --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The test project builds the headless player in the Linux tree of the desktop job, so it reads the compiler cache of that job.
  tests-project:
    name: Test project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: desktop
          cache-size: 1G
      - name: Build the headless player
        run: python haylen.py --verbose build --config Debug --target haylen-headless --jobs ${{ env.JOBS }}
      - name: Build the test library that the native tests load next to the player
        run: python haylen.py --verbose build --config Debug --target haylen-native-test --jobs ${{ env.JOBS }}
      - name: Run every test of the test project
        run: build/linux-debug/bin/haylen-headless samples/tests --frames 60000

  coverage:
    name: Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
      - name: Measure the coverage of the engine tests
        run: python haylen.py --verbose coverage --jobs ${{ env.JOBS }}

  sanitizers:
    name: Sanitizer ${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Run the engine tests under the sanitizer
        run: python haylen.py --verbose test --sanitizers ${{ matrix.sanitizer }} --jobs ${{ env.JOBS }}

  fuzz:
    name: Fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} clang libclang-rt-dev
          cache: fuzz
          cache-size: 600M
      - name: Fuzz the parsers that read hostile bytes for a minute each
        run: python haylen.py --verbose fuzz --seconds 60 --llvm /usr/bin --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # WebGPU draws through SwiftShader and WebGL2 through ANGLE on SwiftShader in the headless Chrome of the runner.
  web-gpu:
    name: Web GPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ninja-build
          emscripten: "true"
      - name: Run the GPU tests on WebGPU in the headless Chrome of the runner
        run: python haylen.py --verbose test --gpu --platform web --graphics-api webGpu --jobs ${{ env.JOBS }}
      - name: Run the GPU tests on WebGL2 in the headless Chrome of the runner
        run: python haylen.py --verbose test --gpu --platform web --graphics-api webGl2 --jobs ${{ env.JOBS }}

  # The player, the content tool and the SDK of Linux and Windows build once per run, and the jobs that release apps take them from these jobs instead of building them again. The Linux artifacts link the libraries of Linux windows. The macOS artifacts build in the two macOS jobs that need them, since a job of their own would hold up the slices of the iOS job.
  desktop-artifacts-linux:
    name: Desktop artifacts on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: desktop-artifacts
          cache-size: 600M
      - name: Build the player, the content tool and the SDK of Linux
        run: python haylen.py --verbose engine --platform desktop --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/desktop-artifacts
        with:
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  desktop-artifacts-windows:
    name: Desktop artifacts on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          cache: desktop-artifacts
          cache-size: 600M
      - name: Build the player, the content tool and the SDK of Windows
        run: python haylen.py --verbose engine --platform desktop --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/desktop-artifacts
        with:
          upload: "true"
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The release that the checks of the web build takes the content tool of the desktop artifacts. The pages draw through WebGL2, since headless Chrome on Linux cannot present a WebGPU canvas, and the macOS job of the test port checks them on WebGPU.
  web:
    name: Web
    needs: desktop-artifacts-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: web
          cache-size: 800M
          emscripten: "true"
          save-tools: emscripten
      - uses: ./.github/actions/desktop-artifacts
      - name: Build the prebuilt player for WebGPU and WebGL2
        run: python haylen.py --verbose engine --platform web --jobs ${{ env.JOBS }}
      - name: Check the error screen, the wake lock and the memory of pages on WebGL2 in the headless Chrome of the runner
        run: python haylen.py --verbose test --platform web --graphics-api webGl2 --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The keys of this job are made for it and thrown away with the runner, so no secret is involved. The job builds the same artifacts as the web job, so it reads the compiler cache of that job.
  release:
    name: Protected web release
    needs: desktop-artifacts-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: web
          cache-size: 800M
          emscripten: "true"
      - uses: ./.github/actions/desktop-artifacts
      - name: Build the protected release of the test project for the web
        run: python haylen.py --verbose prepare samples/tests --platform web --config Release --jobs ${{ env.JOBS }}
      - name: Inspect it for anything a release never holds
        run: python haylen.py --verbose check samples/tests --platform web --config Release

  # The emulator of an x86-64 image runs on the KVM of the Linux runner and draws through SwiftShader, and the tests run on every device of the Android build that starts there.
  android-gpu:
    name: Android GPU tests
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
      HAYLEN_TEST_GPU_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake, the emulator and its system image
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platform-tools" "emulator" "system-images;android-37.0;default;x86_64"
      - uses: ./.github/actions/build-environment
        with:
          packages: ninja-build
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the virtual device that the tests start
        run: mkdir -p "$ANDROID_AVD_HOME" && echo no | avdmanager create avd --name haylen-gpu-tests --package "system-images;android-37.0;default;x86_64"
      - name: Run the GPU tests on the emulator
        run: python haylen.py --verbose test --gpu --platform android --jobs ${{ env.JOBS }}

  # The protected release of an Android app takes the content tool of the desktop artifacts.
  android:
    name: Android
    needs: desktop-artifacts-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the NDK, CMake and the platform
        run: sdkmanager "ndk;30.0.16248370" "cmake;4.1.2" "platforms;android-37.2"
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: android
          cache-size: 2200M
      - uses: ./.github/actions/desktop-artifacts
      - name: Build the Android library and publish it to the local Maven repository
        run: python haylen.py --verbose engine --platform android --jobs ${{ env.JOBS }}
      - name: Create the starter app
        run: python haylen.py --verbose new build/starter
      - name: Give it an upload key
        run: python haylen.py --verbose distribution android-key build/starter
      - name: Build and check its protected release APK
        run: python haylen.py --verbose run build/starter --platform android --config Release --build-only --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # Every family of slices of "Haylen.xcframework" builds in a job of its own, and the iOS job also builds the starter app for the simulator from the slices it built.
  apple:
    name: Apple ${{ matrix.family }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iOS
            cache: ios
            slices: ios ios-simulator
          - family: tvOS
            cache: tvos
            slices: tvos tvos-simulator
          - family: visionOS
            cache: visionos
            slices: xros xros-simulator
          - family: macOS and Mac Catalyst
            cache: mac
            slices: macos ios-maccatalyst
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          cache: apple-${{ matrix.cache }}
          cache-size: 600M
          xcodegen: ${{ matrix.family == 'iOS' }}
          save-tools: ${{ matrix.family == 'iOS' && 'xcodegen' || '' }}
      - name: Build the slices of "Haylen.xcframework"
        run: python haylen.py --verbose engine --platform apple --slices ${{ matrix.slices }} --jobs ${{ env.JOBS }}
      - name: Create the starter app
        if: matrix.family == 'iOS'
        run: python haylen.py --verbose new build/starter
      - name: Build and check its protected release for the iOS simulator
        if: matrix.family == 'iOS'
        run: python haylen.py --verbose run build/starter --platform ios-simulator --config Release --build-only --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  desktop-apps:
    name: Desktop apps on ${{ matrix.system }}
    needs: [desktop-artifacts-linux, desktop-artifacts-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            platform: linux
          - runner: windows-latest
            system: Windows
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }} dpkg-dev desktop-file-utils
          cache: desktop-apps
          cache-size: 600M
      - uses: ./.github/actions/desktop-artifacts
      - name: Install CMake with the AppImage generator of CPack
        if: runner.os == 'Linux'
        run: pip install cmake
      - name: Create the starter app
        run: python haylen.py --verbose new build/starter
      - name: Create a plugin from the plugin template, whose desktop library the app then builds
        run: python haylen.py --verbose plugin new build/echo-check
      - name: Add the plugin to the starter app
        run: python haylen.py --verbose plugin add build/echo-check --app build/starter
      - name: Build the packages of the starter app from the template of the platform
        run: python haylen.py --verbose distribution installer build/starter --platform ${{ matrix.platform }} --output build/dist --jobs ${{ env.JOBS }}
      - name: Check the installed app
        run: python haylen.py --verbose check build/starter --platform ${{ matrix.platform }} --config Release
      - name: Validate the desktop entry
        if: runner.os == 'Linux'
        run: desktop-file-validate build/apps/starter-*/installed/linux/share/applications/*.desktop
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  # The Debug build of the C++ template compiles the engine with the app, and the Release build ships its protected release with the content tool of the desktop artifacts, each in a job of its own.
  cpp-apps:
    name: C++ apps on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            cache-size: 900M
          - runner: windows-latest
            system: Windows
            cache-size: 2500M
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: cpp-apps
          cache-size: ${{ matrix.cache-size }}
      - name: Create the starter C++ app
        run: python haylen.py --verbose new build/starter-cpp --kind cpp
      - name: Build the starter C++ app from the C++ template
        run: python haylen.py --verbose run build/starter-cpp --build-only --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}

  cpp-releases:
    name: C++ releases on ${{ matrix.system }}
    needs: [desktop-artifacts-linux, desktop-artifacts-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: Linux
            cache-size: 900M
          - runner: windows-latest
            system: Windows
            cache-size: 1500M
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          cache: cpp-releases
          cache-size: ${{ matrix.cache-size }}
      - uses: ./.github/actions/desktop-artifacts
      - name: Create the starter C++ app
        run: python haylen.py --verbose new build/starter-cpp --kind cpp
      - name: Build and check the protected release of the starter C++ app
        run: python haylen.py --verbose run build/starter-cpp --config Release --build-only --jobs ${{ env.JOBS }}
      - uses: ./.github/actions/compiler-cache
        if: always()
        with:
          job-status: ${{ job.status }}
