name: Build environment
description: Installs what a job builds the engine with, restores the sources of the dependencies and the tools that the builds download from the bucket "haylen-ci", and compiles through sccache with the compiler cache of the same bucket.

inputs:
  packages:
    description: The Linux packages that the job installs.
    default: ""
  save-sources:
    description: Whether the job saves the sources of the dependencies that its builds fetch, which one job of each system does with the action "caches" at its end while the others read them.
    default: "false"
  save-tools:
    description: The tools whose caches the job saves, from "shader-compiler", "xcodegen" and "emscripten", one job for each tool and system, which saves them with the action "caches" at its end while the other jobs that use them only read them.
    default: ""
  xcodegen:
    description: Whether the job generates Xcode projects with XcodeGen.
    default: "false"
  emscripten:
    description: Whether the job compiles with Emscripten.
    default: "false"
  sccache-version:
    description: The release of sccache that compiles every source of the job, its newest one.
    default: "v0.19.0"
  xcode:
    description: The exact version of Xcode that the jobs of macOS build with, the newest one of their image.
    default: "27.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    # The tooling is a package that uv runs from the lock of the repository, with the Python that ".python-version" pins.
    - uses: astral-sh/setup-uv@v10.3.3

    # The jobs of macOS build with the Xcode of the input alone, so no job takes an older Xcode that the image makes its default, and a job stops when its image lacks that Xcode.
    - name: Select Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        app="/Applications/Xcode_${{ inputs.xcode }}.app"
        if [ ! -d "$app" ]; then
          echo "::error::The image of the runner has no Xcode ${{ inputs.xcode }} at $app. Run the job on an image that installs it, or name the newest Xcode of the image in the input \"xcode\" of the build environment."
          exit 1
        fi
        echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version

    - name: Install the Linux packages
      if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }}

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Install Ninja
      if: runner.os == 'Windows'
      shell: bash
      run: pip install ninja

    # Every build compiles with every processor of the runner.
    - name: Read the processors of the runner and the version of Emscripten
      id: machine
      shell: bash
      run: |
        echo "JOBS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"
        echo "emscripten=$(sed -n 's/^    VERSION = "\(.*\)"$/\1/p' tools/haylen/toolchains/emscripten.py)" >> "$GITHUB_OUTPUT"

    # The SDK keeps the libraries it builds in a folder of its own, outside the cache, so the cache holds only what the SDK downloads: the SDK itself and its ports.
    - name: Keep the libraries that Emscripten builds out of its SDK
      if: inputs.emscripten == 'true'
      shell: bash
      run: echo "EM_CACHE=${{ github.workspace }}/.cache/emscripten" >> "$GITHUB_ENV"

    # The bucket "haylen-ci" keeps one layer under each prefix: the objects of sccache under "sccache/", the sources of the dependencies under "dependencies/" and the tools that the builds download under "tools/". Each cache is an archive whose key ends with everything its contents depend on, so a new pin makes its own and no cache hides a failure. One job of each cache saves it in the runs of the default branch, through the action "caches" at its end, once the job succeeded with a key that the bucket does not hold yet. A pull request from a fork gets no secrets, so it downloads them itself.
    - name: Restore the caches
      if: env.SCCACHE_ENDPOINT != ''
      shell: bash
      run: |
        caches="${{ github.action_path }}/../caches/caches.sh"
        system="${{ runner.os }}-${{ runner.arch }}"
        pins="${{ hashFiles('engine/cmake/haylen-dependencies.cmake', 'engine/cmake/patches/**') }}"
        default_branch="${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
        saving() {
          if [ "$default_branch" = "true" ] && [ "$1" = "true" ]; then
            echo "missing"
          else
            echo "never"
          fi
        }
        bash "$caches" restore "dependencies/sources-${{ runner.os }}-$pins" "$(saving "${{ inputs.save-sources }}")" .cache/cpm
        bash "$caches" restore "tools/shader-compiler-$system-${{ hashFiles('engine/cmake/haylen-shader-compiler.json', 'engine/cmake/haylen-shader-compiler.cmake') }}" "$(saving "${{ contains(inputs.save-tools, 'shader-compiler') }}")" ".tools/haylen-shaderc-*"
        if [ "${{ inputs.xcodegen }}" = "true" ]; then
          bash "$caches" restore "tools/xcodegen-$system-${{ hashFiles('tools/haylen/toolchains/xcodegen.py') }}" "$(saving "${{ contains(inputs.save-tools, 'xcodegen') }}")" ".tools/xcodegen-*"
        fi
        if [ "${{ inputs.emscripten }}" = "true" ]; then
          bash "$caches" restore "tools/emscripten-$system-${{ steps.machine.outputs.emscripten }}" "$(saving "${{ contains(inputs.save-tools, 'emscripten') }}")" .tools/emsdk .cache/emscripten/ports
        fi

    # Apple builds of the engine precompile the shaders of the renderer with the Metal toolchain, a component of Xcode that a runner image may lack.
    - name: Install the Metal toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: xcrun -sdk macosx metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

    # The workflow hands sccache the bucket and its token from the secrets of the repository, which a pull request from a fork does not get, so such a run compiles without the cache.
    - name: Install sccache
      if: env.SCCACHE_ENDPOINT != ''
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: ${{ inputs.sccache-version }}

    # CMake runs every compile of C, C++, Objective-C and Objective-C++ through sccache, and so does Gradle through the CMake of Android. The compiler of Emscripten is a script that stays the same from one version to the next, so a job that compiles with Emscripten puts its version into the hash of every object, through the variable that sccache offers for it.
    - name: Compile through sccache
      if: env.SCCACHE_ENDPOINT != ''
      shell: bash
      run: |
        for language in C CXX OBJC OBJCXX; do
          echo "CMAKE_${language}_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
        done
        if [ "${{ inputs.emscripten }}" = "true" ]; then
          echo "SCCACHE_C_CUSTOM_CACHE_BUSTER=emscripten-${{ steps.machine.outputs.emscripten }}" >> "$GITHUB_ENV"
        fi
