name: Build environment
description: Installs what a job of the workflow builds the engine with, restores the sources of the dependencies and the tools that the builds download, and compiles through the cache of compiled objects that the last run of the job saved.

inputs:
  packages:
    description: The Linux packages that the job installs.
    default: ""
  save-sources:
    description: Whether the job saves the sources of the dependencies that its builds fetch, which the desktop job of each system does, while the other jobs of the system only read them.
    default: "false"
  save-tools:
    description: The tools whose caches the job saves, from "shader-compiler", "xcodegen", "emscripten" and "ccache", one job for each tool and system, while the other jobs that use them only read them.
    default: ""
  xcodegen:
    description: Whether the job generates Xcode projects with XcodeGen.
    default: "false"
  cache:
    description: The name of the compiler cache, which the system, the processor and, for builds with Emscripten, its version complete. A job that compiles the same build trees as another reads its cache, and a job without one compiles without a cache. A job that saves the cache ends with the action "compiler-cache".
    default: ""
  cache-size:
    description: The largest size of the compiler cache, above every object that one run of the job compiles, since a smaller cache drops what the next run needs.
    default: ""
  emscripten:
    description: Whether the job compiles with Emscripten, whose version then keys the compiler cache and the cache of the SDK.
    default: "false"
  ccache-version:
    description: The release of ccache that the jobs of Windows install, its newest one.
    default: "4.14.3"
  ccache-sha256:
    description: The SHA-256 of the archive of that release for x86-64 Windows, which the download must match.
    default: "c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install the Linux packages
      if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }} ${{ inputs.cache != '' && 'ccache' || '' }}

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Install Ninja
      if: runner.os == 'Windows'
      shell: bash
      run: pip install ninja

    # Objects of one version of Emscripten never mix with another, so its version keys the compiler cache, and every build compiles with every processor of the runner.
    - name: Read the version of Emscripten and the processors of the runner
      id: machine
      shell: bash
      run: |
        echo "emscripten=$(python -c 'import haylen; print(haylen.EMSDK_VERSION)')" >> "$GITHUB_OUTPUT"
        echo "JOBS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"

    # The sources of the dependencies and the tools that the builds download come from the releases of their projects, so each one keeps a cache whose name every copy shares and whose key ends with what pins it. One job of each cache saves it, in the runs of the default branch, once the job succeeds with a key that no cache holds yet. Each cache step keeps an id of its own, since the steps of an action that a job uses twice would share the state that saves them.
    - name: Name the pinned caches
      id: pins
      shell: bash
      run: |
        system="${{ runner.os }}-${{ runner.arch }}"
        echo "default-branch=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}" >> "$GITHUB_OUTPUT"
        echo "sources-name=cpm-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
        echo "sources-key=cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake', 'engine/cmake/patches/**') }}" >> "$GITHUB_OUTPUT"
        echo "shader-compiler-name=tool-shader-compiler-$system-" >> "$GITHUB_OUTPUT"
        echo "shader-compiler-key=tool-shader-compiler-$system-${{ hashFiles('engine/cmake/haylen-shader-compiler.json', 'engine/cmake/haylen-shader-compiler.cmake') }}" >> "$GITHUB_OUTPUT"
        echo "xcodegen-name=tool-xcodegen-$system-" >> "$GITHUB_OUTPUT"
        echo "xcodegen-key=tool-xcodegen-$system-$(python -c 'import haylen; print(haylen.XCODEGEN_VERSION + "-" + haylen.XCODEGEN_SHA256)')" >> "$GITHUB_OUTPUT"
        echo "emscripten-name=tool-emscripten-$system-" >> "$GITHUB_OUTPUT"
        echo "emscripten-key=tool-emscripten-$system-${{ steps.machine.outputs.emscripten }}" >> "$GITHUB_OUTPUT"
        echo "ccache-name=tool-ccache-$system-" >> "$GITHUB_OUTPUT"
        echo "ccache-key=tool-ccache-$system-${{ inputs.ccache-version }}-${{ inputs.ccache-sha256 }}" >> "$GITHUB_OUTPUT"

    - name: Restore and save the sources of the dependencies
      id: sources
      if: inputs.save-sources == 'true' && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .cache/cpm
        key: ${{ steps.pins.outputs.sources-key }}

    - name: Restore the sources of the dependencies
      if: steps.sources.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .cache/cpm
        key: ${{ steps.pins.outputs.sources-key }}

    - name: Restore and save the shader compiler
      id: shader-compiler
      if: contains(inputs.save-tools, 'shader-compiler') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/haylen-shaderc-*
        key: ${{ steps.pins.outputs.shader-compiler-key }}

    - name: Restore the shader compiler
      if: steps.shader-compiler.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .tools/haylen-shaderc-*
        key: ${{ steps.pins.outputs.shader-compiler-key }}

    - name: Restore and save XcodeGen
      id: xcodegen
      if: inputs.xcodegen == 'true' && contains(inputs.save-tools, 'xcodegen') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/xcodegen-*
        key: ${{ steps.pins.outputs.xcodegen-key }}

    - name: Restore XcodeGen
      if: inputs.xcodegen == 'true' && steps.xcodegen.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .tools/xcodegen-*
        key: ${{ steps.pins.outputs.xcodegen-key }}

    # The SDK keeps the libraries it builds in a folder of its own, outside the cache, so the cache holds only what the SDK downloads: the SDK itself and its ports.
    - name: Keep the libraries that Emscripten builds out of its SDK
      if: inputs.emscripten == 'true'
      shell: bash
      run: echo "EM_CACHE=${{ github.workspace }}/.cache/emscripten" >> "$GITHUB_ENV"

    - name: Restore and save the Emscripten SDK and its ports
      id: emscripten
      if: inputs.emscripten == 'true' && contains(inputs.save-tools, 'emscripten') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .tools/emsdk
          .cache/emscripten/ports
        key: ${{ steps.pins.outputs.emscripten-key }}

    - name: Restore the Emscripten SDK and its ports
      if: inputs.emscripten == 'true' && steps.emscripten.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: |
          .tools/emsdk
          .cache/emscripten/ports
        key: ${{ steps.pins.outputs.emscripten-key }}

    - name: Install ccache on macOS
      if: inputs.cache != '' && runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install ccache

    - name: Restore and save ccache on Windows
      id: ccache
      if: inputs.cache != '' && runner.os == 'Windows' && contains(inputs.save-tools, 'ccache') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/ccache-${{ inputs.ccache-version }}-windows-x86_64
        key: ${{ steps.pins.outputs.ccache-key }}

    - name: Restore ccache on Windows
      if: inputs.cache != '' && runner.os == 'Windows' && steps.ccache.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .tools/ccache-${{ inputs.ccache-version }}-windows-x86_64
        key: ${{ steps.pins.outputs.ccache-key }}

    - name: Install ccache on Windows
      if: inputs.cache != '' && runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ inputs.ccache-version }}
        SHA256: ${{ inputs.ccache-sha256 }}
      run: |
        $folder = ".tools/ccache-$env:VERSION-windows-x86_64"
        if (-not (Test-Path "$folder/ccache.exe")) {
          $archive = "$env:RUNNER_TEMP/ccache.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$env:VERSION/ccache-$env:VERSION-windows-x86_64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:SHA256) { throw "The archive of ccache $env:VERSION does not match its pinned SHA-256 $env:SHA256." }
          Expand-Archive $archive -DestinationPath .tools
        }
        (Resolve-Path $folder).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # A cache that this job saves under a new key replaces the copies of earlier keys, which hold what an earlier pin named, so the repository keeps one copy of each cache.
    - name: Delete the copies of earlier keys of the caches that this job saves
      if: steps.pins.outputs.default-branch == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPLACED: |
          ${{ steps.sources.outcome == 'success' && steps.sources.outputs.cache-hit != 'true' && format('{0} {1}', steps.pins.outputs.sources-name, steps.pins.outputs.sources-key) || '' }}
          ${{ steps.shader-compiler.outcome == 'success' && steps.shader-compiler.outputs.cache-hit != 'true' && format('{0} {1}', steps.pins.outputs.shader-compiler-name, steps.pins.outputs.shader-compiler-key) || '' }}
          ${{ steps.xcodegen.outcome == 'success' && steps.xcodegen.outputs.cache-hit != 'true' && format('{0} {1}', steps.pins.outputs.xcodegen-name, steps.pins.outputs.xcodegen-key) || '' }}
          ${{ steps.emscripten.outcome == 'success' && steps.emscripten.outputs.cache-hit != 'true' && format('{0} {1}', steps.pins.outputs.emscripten-name, steps.pins.outputs.emscripten-key) || '' }}
          ${{ steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true' && format('{0} {1}', steps.pins.outputs.ccache-name, steps.pins.outputs.ccache-key) || '' }}
      run: |
        while read -r name key; do
          if [ -z "$name" ]; then
            continue
          fi
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$name" --limit 100 --json id,key --jq ".[] | select(.key != \"$key\") | .id" | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
        done <<< "$REPLACED"

    # The name of the cache ends with the run that saves it, so a run restores the newest cache of its name. The objects take the level of compression that keeps them about a seventh smaller than the default at a small cost on each compile that misses.
    - name: Name the compiler cache
      if: inputs.cache != ''
      shell: bash
      run: |
        echo "COMPILER_CACHE=ccache-${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}${{ inputs.emscripten == 'true' && format('-emscripten-{0}', steps.machine.outputs.emscripten) || '' }}-" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=${{ inputs.cache-size }}" >> "$GITHUB_ENV"
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESSLEVEL=6" >> "$GITHUB_ENV"

    - name: Restore the compiler cache
      if: inputs.cache != ''
      uses: actions/cache/restore@v6
      with:
        path: .ccache
        key: ${{ env.COMPILER_CACHE }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ env.COMPILER_CACHE }}

    # The counts start at zero and the time of the start is kept, so the action "compiler-cache" sees what this run compiled and which objects it used.
    - name: Compile through the compiler cache
      if: inputs.cache != ''
      shell: bash
      run: |
        ccache --zero-stats
        echo "COMPILER_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
        for language in C CXX OBJC OBJCXX; do
          echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        done
