name: Build environment
description: Installs what a job of the workflow builds the engine with, restores the sources of the dependencies, and compiles through a cache of compiled objects that the next run of the job starts from.

inputs:
  cache:
    description: The name of the compiler cache. Jobs that compile the same build trees on the same system share it, and the system and processor complete it.
    required: true
  cache-size:
    description: The largest size of the compiler cache, above every object that one run of the job compiles, since a smaller cache drops what the next run needs.
    required: true
  save-cache:
    description: Whether the job saves its compiler cache, or only reads the cache that another job saves for the same build trees.
    default: "true"
  sources:
    description: The set of dependency sources that the builds of the job fetch, "desktop", "web", "android" or "apple", which jobs that fetch the same set share.
    required: true
  packages:
    description: The Linux packages that the job installs.
    default: ""
  emscripten:
    description: Whether the job builds for the web, which restores the Emscripten SDK and keys the compiler cache with its version.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install the Linux packages
      if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }}

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Install Ninja
      if: runner.os == 'Windows'
      shell: bash
      run: pip install ninja

    # Objects of one version of Emscripten never mix with another, so its version keys the caches of web builds, and every build compiles with every processor of the runner.
    - name: Read the version of Emscripten and the processors of the runner
      id: machine
      shell: bash
      run: |
        echo "emscripten=$(python -c 'import haylen; print(haylen.EMSDK_VERSION)')" >> "$GITHUB_OUTPUT"
        echo "JOBS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"

    - name: Restore the sources of the dependencies
      uses: actions/cache@v6
      with:
        path: .cache/cpm
        key: cpm-${{ runner.os }}-${{ inputs.sources }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake', 'engine/cmake/patches/**') }}

    - name: Restore the Emscripten SDK
      if: inputs.emscripten == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/emsdk
        key: emsdk-${{ runner.os }}-${{ steps.machine.outputs.emscripten }}

    - name: Restore the compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}${{ inputs.emscripten == 'true' && format('-emscripten-{0}', steps.machine.outputs.emscripten) || '' }}
        max-size: ${{ inputs.cache-size }}
        evict-old-files: job
        save: ${{ inputs.save-cache }}

    - name: Compile through the compiler cache
      shell: bash
      run: |
        for language in C CXX OBJC OBJCXX; do
          echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        done
