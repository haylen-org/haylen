name: Build environment
description: Installs what a job builds the engine with, restores the sources of the dependencies and the tools that the builds download, and compiles through sccache with the compiler cache of the bucket "haylen-ci".

inputs:
  packages:
    description: The Linux packages that the job installs.
    default: ""
  save-sources:
    description: Whether the job saves the sources of the dependencies that its builds fetch, which one job of each system does while the others read them.
    default: "false"
  save-tools:
    description: The tools whose caches the job saves, from "shader-compiler", "xcodegen" and "emscripten", one job for each tool and system, while the other jobs that use them only read them.
    default: ""
  xcodegen:
    description: Whether the job generates Xcode projects with XcodeGen.
    default: "false"
  emscripten:
    description: Whether the job compiles with Emscripten.
    default: "false"
  sccache-version:
    description: The release of sccache that compiles every source of the job, its newest one.
    default: "v0.19.0"
  xcode:
    description: The exact version of Xcode that the jobs of macOS build with, the newest one of their image.
    default: "27.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    # The tooling is a package that uv runs from the lock of the repository, with the Python that ".python-version" pins.
    - uses: astral-sh/setup-uv@v10.3.3

    # The jobs of macOS build with the Xcode of the input alone, so no job takes an older Xcode that the image makes its default, and a job stops when its image lacks that Xcode.
    - name: Select Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        app="/Applications/Xcode_${{ inputs.xcode }}.app"
        if [ ! -d "$app" ]; then
          echo "::error::The image of the runner has no Xcode ${{ inputs.xcode }} at $app. Run the job on an image that installs it, or name the newest Xcode of the image in the input \"xcode\" of the build environment."
          exit 1
        fi
        echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version

    - name: Install the Linux packages
      if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }}

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Install Ninja
      if: runner.os == 'Windows'
      shell: bash
      run: pip install ninja

    # Every build compiles with every processor of the runner.
    - name: Read the processors of the runner and the version of Emscripten
      id: machine
      shell: bash
      run: |
        echo "JOBS=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_ENV"
        echo "emscripten=$(sed -n 's/^    VERSION = "\(.*\)"$/\1/p' tools/haylen/toolchains/emscripten.py)" >> "$GITHUB_OUTPUT"

    # The sources of the dependencies and the tools that the builds download come from the releases of their projects, and each one keeps a cache whose key ends with what pins it. One job of each cache saves it in the runs of the default branch, once the job succeeds with a key that no cache holds yet. Each cache step keeps an id of its own, since the steps of an action that a job uses twice would share the state that saves them.
    - name: Name the caches
      id: pins
      shell: bash
      run: |
        system="${{ runner.os }}-${{ runner.arch }}"
        echo "default-branch=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}" >> "$GITHUB_OUTPUT"
        echo "sources=cpm-${{ runner.os }}-${{ hashFiles('engine/cmake/haylen-dependencies.cmake', 'engine/cmake/patches/**') }}" >> "$GITHUB_OUTPUT"
        echo "shader-compiler=tool-shader-compiler-$system-${{ hashFiles('engine/cmake/haylen-shader-compiler.json', 'engine/cmake/haylen-shader-compiler.cmake') }}" >> "$GITHUB_OUTPUT"
        echo "xcodegen=tool-xcodegen-$system-${{ hashFiles('tools/haylen/toolchains/xcodegen.py') }}" >> "$GITHUB_OUTPUT"
        echo "emscripten=tool-emscripten-$system-${{ steps.machine.outputs.emscripten }}" >> "$GITHUB_OUTPUT"

    - name: Restore and save the dependency sources
      id: sources
      if: inputs.save-sources == 'true' && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .cache/cpm
        key: ${{ steps.pins.outputs.sources }}

    - name: Restore the dependency sources
      if: steps.sources.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .cache/cpm
        key: ${{ steps.pins.outputs.sources }}

    - name: Restore and save the shader compiler
      id: shader-compiler
      if: contains(inputs.save-tools, 'shader-compiler') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/haylen-shaderc-*
        key: ${{ steps.pins.outputs.shader-compiler }}

    - name: Restore the shader compiler
      if: steps.shader-compiler.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .tools/haylen-shaderc-*
        key: ${{ steps.pins.outputs.shader-compiler }}

    - name: Restore and save XcodeGen
      id: xcodegen
      if: inputs.xcodegen == 'true' && contains(inputs.save-tools, 'xcodegen') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: .tools/xcodegen-*
        key: ${{ steps.pins.outputs.xcodegen }}

    - name: Restore XcodeGen
      if: inputs.xcodegen == 'true' && steps.xcodegen.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: .tools/xcodegen-*
        key: ${{ steps.pins.outputs.xcodegen }}

    # The SDK keeps the libraries it builds in a folder of its own, outside the cache, so the cache holds only what the SDK downloads: the SDK itself and its ports.
    - name: Keep the libraries that Emscripten builds out of its SDK
      if: inputs.emscripten == 'true'
      shell: bash
      run: echo "EM_CACHE=${{ github.workspace }}/.cache/emscripten" >> "$GITHUB_ENV"

    - name: Restore and save Emscripten
      id: emscripten
      if: inputs.emscripten == 'true' && contains(inputs.save-tools, 'emscripten') && steps.pins.outputs.default-branch == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .tools/emsdk
          .cache/emscripten/ports
        key: ${{ steps.pins.outputs.emscripten }}

    - name: Restore Emscripten
      if: inputs.emscripten == 'true' && steps.emscripten.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: |
          .tools/emsdk
          .cache/emscripten/ports
        key: ${{ steps.pins.outputs.emscripten }}

    # Apple builds of the engine precompile the shaders of the renderer with the Metal toolchain, a component of Xcode that a runner image may lack.
    - name: Install the Metal toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: xcrun -sdk macosx metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

    # The workflow hands sccache the bucket and its token from the secrets of the repository, which a pull request from a fork does not get, so such a run compiles without the cache.
    - name: Install sccache
      if: env.SCCACHE_ENDPOINT != ''
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: ${{ inputs.sccache-version }}

    # CMake runs every compile of C, C++, Objective-C and Objective-C++ through sccache, and so does Gradle through the CMake of Android. The compiler of Emscripten is a script that stays the same from one version to the next, so a job that compiles with Emscripten puts its version into the hash of every object, through the variable that sccache offers for it.
    - name: Compile through sccache
      if: env.SCCACHE_ENDPOINT != ''
      shell: bash
      run: |
        for language in C CXX OBJC OBJCXX; do
          echo "CMAKE_${language}_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
        done
        if [ "${{ inputs.emscripten }}" = "true" ]; then
          echo "SCCACHE_C_CUSTOM_CACHE_BUSTER=emscripten-${{ steps.machine.outputs.emscripten }}" >> "$GITHUB_ENV"
        fi
