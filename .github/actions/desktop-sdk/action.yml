name: Desktop SDK
description: Hands the desktop SDK of the system, with its player and its content tool, which the job "desktop-sdk" of the system builds, to the other jobs of the same run through an artifact of the run, which no release and no other run reads and which GitHub deletes after a day. With "upload" the job that built it hands it over, and without it a job takes it where the tooling finds it current, from the sources of the same commit.

inputs:
  upload:
    description: Whether the job hands over the SDK it built instead of taking it.
    default: "false"

runs:
  using: composite
  steps:
    # A tar keeps the modes of the executables, which an artifact of the run drops.
    - name: Pack the desktop SDK
      if: inputs.upload == 'true'
      shell: bash
      run: tar -cf desktop-sdk.tar build/sdk/desktop-release

    - name: Hand the desktop SDK to the other jobs of the run
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: desktop-sdk-${{ runner.os }}
        path: desktop-sdk.tar
        retention-days: 1
        if-no-files-found: error

    - name: Take the desktop SDK of the run
      if: inputs.upload != 'true'
      uses: actions/download-artifact@v8
      with:
        name: desktop-sdk-${{ runner.os }}

    - name: Unpack the desktop SDK
      if: inputs.upload != 'true'
      shell: bash
      run: tar -xf desktop-sdk.tar && rm desktop-sdk.tar
