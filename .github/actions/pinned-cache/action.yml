name: Pinned cache
description: Restores a cache whose key changes with the pins of what it holds, such as the sources of the dependencies or a tool of the builds. The one job that saves it does so in the runs of the default branch, pushed or started by hand, after the job succeeds and only when the key is new, and it first deletes the copies of earlier keys, so the repository keeps one copy of each cache. Every other job and every run of another branch or of a pull request only reads it.

inputs:
  name:
    description: The start of the key that every copy of the cache shares, such as "tool-emscripten-Linux-X64-", which no other cache starts with.
    required: true
  key:
    description: The whole key, the name followed by what pins the content, such as a version or the hash of the files that pin it.
    required: true
  path:
    description: The folders of the cache, one per line.
    required: true
  save:
    description: Whether this job is the one that saves the cache.
    default: "false"

outputs:
  cache-hit:
    description: Whether the cache of the key was found.
    value: ${{ steps.saved.outputs.cache-hit || steps.read.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore and save the cache
      id: saved
      if: inputs.save == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - name: Restore the cache
      id: read
      if: steps.saved.outcome == 'skipped'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    # A new key means a new pin, so the copies of earlier keys hold what nothing uses anymore.
    - name: Delete the copies of earlier keys
      if: steps.saved.outcome == 'success' && steps.saved.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        KEY: ${{ inputs.key }}
      run: gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$NAME" --limit 100 --json id,key --jq ".[] | select(.key != \"$KEY\") | .id" | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
