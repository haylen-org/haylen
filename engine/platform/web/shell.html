<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Haylen</title>
    <link rel="icon" href="haylen-logo.svg">
    <style>
        /* The look of the splash. A project restyles it with these variables in a copy of this file that `WEB_SHELL` of `haylen_add_app` names. */
        :root {
            --splash-background: #101418;
            --splash-logo-size: min(40vmin, 200px);
            --splash-bar-width: min(60vw, 280px);
            --splash-bar-height: 4px;
            --splash-gap: 20px;
            --splash-font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            --splash-text: rgba(255, 255, 255, 0.8);
            --splash-track: rgba(255, 255, 255, 0.15);
            --splash-bar: #ffffff;
            --splash-failed: #feb2b2;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--splash-background);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            display: block;
            outline: none;
        }

        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--splash-gap);
            padding: 24px;
            box-sizing: border-box;
            background: var(--splash-background);
            color: var(--splash-text);
            font: var(--splash-font);
            transition: opacity 0.3s ease;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash-logo {
            width: var(--splash-logo-size);
            height: var(--splash-logo-size);
        }

        #splash-progress {
            width: var(--splash-bar-width);
            height: var(--splash-bar-height);
            border-radius: calc(var(--splash-bar-height) / 2);
            background: var(--splash-track);
            overflow: hidden;
        }

        #splash-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--splash-bar);
            transition: width 0.15s linear;
        }

        #splash-progress.indeterminate #splash-bar {
            width: 30%;
            animation: splash-sweep 1.2s ease-in-out infinite alternate;
        }

        @keyframes splash-sweep {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(233%);
            }
        }

        #splash-percent {
            margin: calc(var(--splash-gap) / -2) 0 0;
            font-variant-numeric: tabular-nums;
        }

        #splash-status {
            margin: 0;
            max-width: 640px;
            text-align: center;
            white-space: pre-wrap;
            color: var(--splash-failed);
        }

        #splash.failed #splash-progress,
        #splash.failed #splash-percent {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="splash">
        <img id="splash-logo" src="haylen-logo.svg" alt="Haylen">
        <div id="splash-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="splash-bar"></div>
        </div>
        <p id="splash-percent" aria-hidden="true">0%</p>
        <p id="splash-status" hidden></p>
    </div>
    <script>
        // The runtime downloads the WebAssembly module and the package of the app and reports the progress of both, with a total of 0 while a size is unknown. It ends the splash once the app drew its first frame, and the errors that keep the app from starting replace the progress bar.
        let started = false;
        var Module = {
            canvas: document.getElementById("canvas"),
            haylen: {
                packageUrl: new URLSearchParams(location.search).get("package"),
                graphicsApi: new URLSearchParams(location.search).get("graphicsApi"),
                onLoadProgress: function ({loaded, total}) {
                    const progress = document.getElementById("splash-progress");
                    const percent = total > 0 ? Math.min(100, Math.round((loaded * 100) / total)) : null;
                    progress.classList.toggle("indeterminate", percent === null);
                    document.getElementById("splash-bar").style.width = percent === null ? "" : percent + "%";
                    document.getElementById("splash-percent").textContent = percent === null ? "" : percent + "%";
                    if (percent === null) {
                        progress.removeAttribute("aria-valuenow");
                    } else {
                        progress.setAttribute("aria-valuenow", String(percent));
                    }
                },
                onStarted: function () {
                    started = true;
                },
                onSplashEnded: function ({fadeOut}) {
                    const splash = document.getElementById("splash");
                    splash.style.transitionDuration = fadeOut + "s";
                    splash.classList.add("hidden");
                },
                onError: function (error) {
                    if (started) {
                        return;
                    }
                    const status = document.getElementById("splash-status");
                    document.getElementById("splash").classList.add("failed");
                    status.textContent = error.message;
                    status.hidden = false;
                },
            },
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
