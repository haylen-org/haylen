<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor check</title>
<style>
    html, body { margin: 0; background: #101418; }
    canvas { display: block; width: 640px; height: 360px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    // The project that the editor check builds file by file: a scene whose speed comes from a module, which plays a looping tone, and code that never ends. The Worker mode also runs a scene that counts the presses of the space key and of the left mouse button and keeps where the mouse pressed, a scene that reads the first controller, a button that the mirror of screen readers activates, a plugin whose web module answers on the page, a video, and code that holds the worker longer than the check waits for its execution budget. Both modes run a finalizer that never ends, which the execution budget stops.
    const tone = [
        "local audio = require('haylen.audio')",
        "local samples = {}",
        "for index = 1, 22050 do samples[index] = string.pack('<h', math.floor(math.sin(index * 2 * math.pi * 440 / 22050) * 2000)) end",
        "beep = audio.newSound(table.concat(samples), {format = 'int16', sampleRate = 22050, channels = 1})",
        "audio.play(beep, {loop = true})",
    ].join("\n");
    const check = {
        app: JSON.stringify({ name: "Editor Check", identifier: "com.haylen.editorcheck", lua: { executionBudget: 1 } }),
        main: "settings = require('settings')\ncount = 0\nrequire('haylen.scene').push({update = function() count = count + settings.step end})\n" + tone,
        first: "return {step = 1}",
        second: "return {step = 2}",
        endless: "require('haylen.scene').push({update = function() while true do pcall(function() while true do end end) end end})",
        input: "input = require('haylen.input')\nkeys, clicks, x, y = 0, 0, 0, 0\nrequire('haylen.scene').push({update = function() if input.keyPressed('space') then keys = keys + 1 end if input.mousePressed('left') then clicks = clicks + 1 x, y = input.mouseFramebufferPosition() end end})",
        // A project that writes its user data, which a second tab of the same storage namespace refuses.
        note: "written, failure = pcall(require('haylen.storage').writeText, 'note.txt', 'kept')",
        // A scene that counts its updates and the sizes of the window it hears, under a button of the UI, while the page hides its canvas and shows it again.
        canvas: "window = require('haylen.window')\nsizes = {}\ncount = 0\nrequire('haylen.events').on('windowResized', function(event) sizes[#sizes + 1] = string.format('%dx%d', event.width, event.height) end)\nrequire('haylen.ui').mount(require('haylen.ui').column{require('haylen.ui').button{text = 'Play'}})\nrequire('haylen.scene').push({update = function() count = count + 1 end})",
        // A project that plays the tone and leaves a timer and a task that wake after three seconds, which a run of another project ends before they wake.
        stale: tone + "\nrequire('haylen.timer').after(3, function() print('Stale timer of the first run.') end)\nlocal async = require('async')\nasync.spawn(function() async.sleep(3):await() print('Stale task of the first run.') end)",
        finalizer: "require('haylen.scene').push({update = function() setmetatable({}, {__gc = function() while true do end end}) collectgarbage() end})",
        // Code that holds the worker longer than the check waits, under a budget of ten minutes.
        stuckApp: JSON.stringify({ name: "Editor Check", identifier: "com.haylen.editorcheck", lua: { executionBudget: 600 } }),
        stuck: "require('haylen.scene').push({update = function() while true do end end})",
        gamepad: "input = require('haylen.input')\nrequire('haylen.scene').push({update = function() pad = {tostring(input.gamepadConnected(1)), input.gamepadName(1) or '', tostring(input.gamepadDown('south', 1)), string.format('%.2f', input.gamepadAxis('rightTrigger', 1))} end})",
        interface: "ui = require('haylen.ui')\nclicked = false\nrequire('haylen.scene').push({enter = function(self) self.gui = ui.mount(ui.column{ui.button{text = 'Play', onClick = function() clicked = true end}}, {owner = self}) end})",
        // A plugin whose web module answers a method, opens a screen and pushes a video stream and an audio stream from the page, and a scene that calls the method, opens the screen and shows the stream.
        probeApp: JSON.stringify({ name: "Editor Check", identifier: "com.haylen.editorcheck", plugins: { probe: {} } }),
        probePlugin: JSON.stringify({ interface: 1, id: "probe", name: "Probe", version: "1.0.0", description: "Answers the plugin step of the editor check.", implementations: { web: "native" } }),
        probeSource: "return require('haylen.platform').plugin('probe')",
        probeMain: "local async = require('async')\nprobe = require('probe')\nstream = probe:videoStream('frames')\nresults = {}\nasync.spawn(function()\n  local answer = probe:call('echo', {text = 'hello'}):await()\n  results.echo = answer and answer.echoed or 'none'\n  local picked = probe:openScreen('pick', {choice = 'blue'}):await()\n  results.screen = picked and picked.picked or 'none'\nend)",
        // A clip of the engine tests, which the driver hands the page, and a scene that plays it muted.
        videoMain: "video = require('haylen.video')\nclip = video.load('clip.mp4', {autoplay = true, muted = true})",
        // A controller in the standard mapping that the browser would report, with the south button down and the right trigger pulled all the way, which the dead zone of the engine leaves whole.
        pad: { index: 0, id: "Wireless Controller (STANDARD GAMEPAD Vendor: 054c Product: 09cc)", connected: true, mapping: "standard", buttons: Array.from({ length: 17 }, (_, place) => ({ pressed: place === 0, value: place === 0 || place === 7 ? 1 : 0 })), axes: [0, 0, 0, 0] },
        // A project that tells whether it runs outside development, where the execution budget leaves the hooks of Lua to the app, with the console that a project outside development turns on itself so the editor inspects it.
        outsideApp: JSON.stringify({ name: "Editor Check", identifier: "com.haylen.editorcheck", debug: { console: true } }),
        outside: "outside = pcall(debug.sethook)",
        errors: [],
    };
    // The page runs the runtime on itself, or in the Worker mode with "?hosting=worker", where it loads the page side of the runtime alone. With "&server=<address>" it names a development server without asking for development.
    const params = new URLSearchParams(location.search);
    var Module = {
        canvas: document.getElementById("canvas"),
        preRun: [],
        haylen: {
            hosting: params.get("hosting") || undefined,
            development: params.get("server") ? undefined : true,
            developmentServer: params.get("server") || undefined,
            storageNamespace: "editor-check",
            projectBudget: { files: 16, bytes: 1048576 },
            graphicsApi: params.get("graphicsApi") || undefined,
            onError: (error) => check.errors.push(error),
        },
    };
    // With "&hold=1" the Worker mode holds the start of its worker until the check lets it go.
    if (params.get("hold")) {
        Module.preRun.push(() => Module.addRunDependency("check"));
    }
    const editor = { request: (method, values) => Module.haylen.editor.request(method, values) };
    const runtime = document.createElement("script");
    runtime.src = Module.haylen.hosting === "worker" ? "haylen-page.js" : "haylen.js";
    document.body.appendChild(runtime);
</script>
</body>
</html>
