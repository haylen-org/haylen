# The settings of pytest for the UI tests of apps on Windows, which "haylen test --ui <app> --target windows" runs: the test files of the folder "ui-tests/windows" of the app, whose classes end with "Tests", as the UI tests of the other platforms name them.
[pytest]
addopts = -p no:cacheprovider
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
