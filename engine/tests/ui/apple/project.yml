# XcodeGen spec of the UI test runner of apps, which "haylen test --ui" generates into the folder that "HAYLEN_UI_RUNNER" names with the Swift tests of the folder that "HAYLEN_UI_TESTS" names, the folder "ui-tests/apple" of the app. The Info.plist of each runner names the app it drives, "HAYLEN_UI_APP", and the folder of its screenshots, "HAYLEN_UI_OUTPUT", so the runner needs nothing from the command that runs it, as on a farm of devices. The runner of the Mac drives a macOS or a Mac Catalyst app, both apps of the Mac, which it launches from the bundle that "HAYLEN_UI_APP_PATH" names, since a Mac installs no app for the tests, and it keeps its screenshots in its result bundle, since its sandbox lets it write nowhere else.
name: HaylenUITests
options:
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    visionOS: "1.0"
    macOS: "14.0"
settings:
  base:
    PRODUCT_NAME: HaylenUITests
    PRODUCT_BUNDLE_IDENTIFIER: com.haylen.uitests
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
targets:
  iOS:
    type: bundle.ui-testing
    platform: iOS
    info:
      path: ${HAYLEN_UI_RUNNER}/iOS-Info.plist
      properties: &properties
        HaylenUIApp: ${HAYLEN_UI_APP}
        HaylenUIOutput: ${HAYLEN_UI_OUTPUT}
    sources: &sources
      - support
      - path: ${HAYLEN_UI_TESTS}
        name: ui-tests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  tvOS:
    type: bundle.ui-testing
    platform: tvOS
    info:
      path: ${HAYLEN_UI_RUNNER}/tvOS-Info.plist
      properties: *properties
    sources: *sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
  visionOS:
    type: bundle.ui-testing
    platform: visionOS
    info:
      path: ${HAYLEN_UI_RUNNER}/visionOS-Info.plist
      properties: *properties
    sources: *sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
  macOS:
    type: bundle.ui-testing
    platform: macOS
    info:
      path: ${HAYLEN_UI_RUNNER}/macOS-Info.plist
      properties:
        HaylenUIApp: ${HAYLEN_UI_APP}
        HaylenUIAppPath: ${HAYLEN_UI_APP_PATH}
    sources: *sources
# The test action of every scheme runs the runner without a debugger, since a runner that xcodebuild launches under the debugger waits for it to attach, and nothing attaches in a run from the command line. It captures the screen as screenshots, since the test manager of iOS 17 ends when Xcode asks it for a screen recording.
schemes:
  iOS:
    build:
      targets:
        iOS: [test]
    test:
      targets: [iOS]
      debugEnabled: false
      preferredScreenCaptureFormat: screenshots
  tvOS:
    build:
      targets:
        tvOS: [test]
    test:
      targets: [tvOS]
      debugEnabled: false
      preferredScreenCaptureFormat: screenshots
  visionOS:
    build:
      targets:
        visionOS: [test]
    test:
      targets: [visionOS]
      debugEnabled: false
      preferredScreenCaptureFormat: screenshots
  macOS:
    build:
      targets:
        macOS: [test]
    test:
      targets: [macOS]
      debugEnabled: false
      preferredScreenCaptureFormat: screenshots
