# XcodeGen spec of the UI test runner of apps, which "haylen test --ui" generates into the build folder with the Swift tests of the folder that "HAYLEN_UI_TESTS" names, the folder "ui-tests" of the app.
name: HaylenUITests
options:
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    visionOS: "1.0"
settings:
  base:
    PRODUCT_NAME: HaylenUITests
    PRODUCT_BUNDLE_IDENTIFIER: com.haylen.uitests
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
targets:
  iOS:
    type: bundle.ui-testing
    platform: iOS
    sources: &sources
      - support
      - path: ${HAYLEN_UI_TESTS}
        name: ui-tests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  tvOS:
    type: bundle.ui-testing
    platform: tvOS
    sources: *sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
  visionOS:
    type: bundle.ui-testing
    platform: visionOS
    sources: *sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "7"
# The test action of every scheme runs the runner without a debugger, since a runner that xcodebuild launches under the debugger waits for it to attach, and nothing attaches in a run from the command line.
schemes:
  iOS:
    build:
      targets:
        iOS: [test]
    test:
      targets: [iOS]
      debugEnabled: false
  tvOS:
    build:
      targets:
        tvOS: [test]
    test:
      targets: [tvOS]
      debugEnabled: false
  visionOS:
    build:
      targets:
        visionOS: [test]
    test:
      targets: [visionOS]
      debugEnabled: false
