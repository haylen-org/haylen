<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Haylen</title>
    <!-- The page has no icon of its own, so the browser downloads none before the loader shows the splash logo there. -->
    <link rel="icon" href="data:,">
    <!-- The configuration downloads next to the style and the loader, so the splash knows its background and its logo one round trip sooner. -->
    <link rel="preload" href="config.json" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="loader.css">
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="splash" class="starting">
        <div id="splash-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="splash-bar"></div>
        </div>
        <p id="splash-caption" aria-hidden="true"><span>Loading</span><span id="splash-percent">0%</span></p>
        <p id="splash-status" hidden></p>
        <pre id="splash-details" hidden></pre>
    </div>
    <!-- The turn screen covers a phone or a tablet held in an orientation that the app does not take, until the device turns. -->
    <div id="turn" role="alert" hidden>
        <svg id="turn-icon" viewBox="0 0 96 96" aria-hidden="true">
            <rect x="30" y="14" width="36" height="62" rx="7" fill="none" stroke="currentColor" stroke-width="5"/>
            <path d="M18 62 A34 34 0 0 1 22 30" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M14 34 L22 28 L28 36" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p id="turn-caption"></p>
    </div>
    <!-- The tooling puts the loader and the page scripts of the app here. -->
    {{SCRIPTS}}
</body>
</html>
